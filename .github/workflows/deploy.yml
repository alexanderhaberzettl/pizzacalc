name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The site is served from the gh-pages branch, so the build is committed there.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pizzacalc-pwa/package-lock.json

      - name: Install dependencies
        working-directory: pizzacalc-pwa
        run: npm ci

      - name: Build
        working-directory: pizzacalc-pwa
        run: npm run build

      - name: Check out gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish build to gh-pages
        working-directory: gh-pages
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../pizzacalc-pwa/build/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy PWA (${GITHUB_SHA::7})"
            git push origin gh-pages
          fi
